# Selfie Portal v2 - Three-Tier Access Nginx Configuration
# Date: August 21, 2025
# 
# This configuration implements three tiers of access:
# 1. Full Private (10.10.42.x, 127.0.0.x) - Complete functionality
# 2. Semi-Public (192.168.6.x) - Read-only gallery + health status
# 3. External (Internet via Cloudflare) - Read-only gallery only

# Full private access routes (AP WiFi clients and localhost)
# Location: /selfies/* - Full functionality including upload/delete
location /selfies {
    # Allow only private network ranges
    allow 10.10.42.0/24;    # AP WiFi clients
    allow 127.0.0.1;        # localhost
    allow ::1;              # IPv6 localhost
    deny all;
    
    # Proxy to Flask application
    proxy_pass http://127.0.0.1:5001;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    
    # Handle large file uploads
    client_max_body_size 10M;
    proxy_request_buffering off;
}

# Private health endpoint (detailed health info)
# Location: /health - Full system health information
location /health {
    # Allow only private network ranges
    allow 10.10.42.0/24;    # AP WiFi clients
    allow 127.0.0.1;        # localhost
    allow ::1;              # IPv6 localhost
    deny all;
    
    proxy_pass http://127.0.0.1:5001/health;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
}

# Semi-public health endpoint (sanitized health info)
# Location: /status - Basic health status for semi-public access
location /status {
    # Allow private and semi-public network ranges
    allow 10.10.42.0/24;    # AP WiFi clients (full private)
    allow 192.168.6.0/24;   # wlan0 interface (semi-public)
    allow 127.0.0.1;        # localhost
    allow ::1;              # IPv6 localhost
    deny all;
    
    proxy_pass http://127.0.0.1:5001/status;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    
    # Read-only methods only
    limit_except GET HEAD {
        deny all;
    }
}

# Public gallery (read-only for semi-public and external access)
# Location: /gallery - Griffin Creek Trestle branded gallery
location /gallery {
    # Open to all networks (semi-public and external via Cloudflare)
    # Access control handled by Flask application based on IP detection
    
    proxy_pass http://127.0.0.1:5001/gallery;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    
    # Read-only methods only
    limit_except GET HEAD {
        deny all;
    }
    
    # Caching for better performance on external access
    proxy_cache_valid 200 5m;
    add_header Cache-Control "public, max-age=300";
}

# Public API endpoint for curated selfies
# Location: /api/public/selfies - JSON API for external consumption
location /api/public/selfies {
    # Open to all networks (semi-public and external)
    
    proxy_pass http://127.0.0.1:5001/api/public/selfies;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    
    # Read-only methods only
    limit_except GET HEAD {
        deny all;
    }
    
    # JSON response caching
    proxy_cache_valid 200 2m;
    add_header Cache-Control "public, max-age=120";
    add_header Content-Type "application/json";
}

# Static file serving (images, CSS, JS)
# Location: /data/uploads/* - Serve uploaded selfie images
location /data/uploads/ {
    # Allow access based on context
    # Private users: full access via /selfies/data/uploads/
    # Public users: access via /gallery (Flask handles authorization)
    
    alias /var/www/ansibledest.local/apps/selfies/data/uploads/;
    
    # Security headers for images
    add_header X-Content-Type-Options nosniff;
    add_header X-Frame-Options DENY;
    
    # Caching for images
    expires 1h;
    add_header Cache-Control "public, immutable";
}

# Static assets (CSS, JS, fonts)
# Location: /static/* - Application assets
location /static/ {
    alias /var/www/ansibledest.local/apps/selfies/static/;
    
    # Long-term caching for static assets
    expires 1d;
    add_header Cache-Control "public, immutable";
}

# Root redirect logic
# Location: / - Route users to appropriate interface based on network tier
location / {
    # This should be implemented at the server block level or virtual host level
    # Private users (10.10.42.x) -> /selfies (full functionality)
    # Semi-public users (192.168.6.x) -> /gallery (read-only)
    # External users -> /gallery (read-only)
    
    # Example conditional redirect (may need adjustment based on actual nginx setup)
    set $redirect_target "/gallery";
    if ($remote_addr ~ "^10\.10\.42\.") {
        set $redirect_target "/selfies";
    }
    
    return 301 $redirect_target;
}

# Error pages
error_page 403 /error/403.html;
error_page 404 /error/404.html;
error_page 500 502 503 504 /error/50x.html;

# Additional security headers
add_header X-Frame-Options DENY;
add_header X-Content-Type-Options nosniff;
add_header X-XSS-Protection "1; mode=block";
add_header Referrer-Policy "strict-origin-when-cross-origin";

# Rate limiting (optional, adjust as needed)
# limit_req_zone $binary_remote_addr zone=api:10m rate=10r/m;
# limit_req zone=api burst=5 nodelay;

# Notes for deployment:
# 1. This configuration should be integrated into the main nginx site configuration
# 2. Adjust paths to match actual deployment directory structure
# 3. Test thoroughly with requests from each network tier
# 4. Monitor logs for proper access control enforcement
# 5. Consider implementing additional rate limiting for public endpoints