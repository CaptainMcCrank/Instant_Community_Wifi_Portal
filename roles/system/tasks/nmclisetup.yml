---
    - name: Stop hostapd service initially
      systemd:
        name: hostapd
        state: stopped
        enabled: no

    - name: Stop dnsmasq service initially
      systemd:
        name: dnsmasq
        state: stopped
        enabled: no
    
    # Check if NetworkManager connection exists
    - name: Check if AP connection profile exists
      command: nmcli connection show "{{ ap_name }}"
      register: nmcli_show_result
      failed_when: false
      changed_when: false
    
    # Delete the connection if it exists to ensure clean setup
    - name: Delete existing AP connection if exists
      community.general.nmcli:
        state: absent
        conn_name: "{{ ap_name }}"
      when: nmcli_show_result.rc == 0

    # Create the access point connection
#    - name: Create access point connection
#      community.general.nmcli:
#        state: present
#        type: wifi
#        conn_name: "{{ ap_name }}"
#        ifname: "{{ interface_name }}"
#        wifi:
#          ssid: "{{ ssid }}"
#          mode: ap

    - name: Create access point connection
      command: >
        nmcli con add type wifi
        con-name "{{ ap_name }}"
        autoconnect yes
        ifname "{{ interface_name }}"
        ssid "{{ ssid }}"
        mode ap

    # Configure the connection for 2.4GHz band (mode g)
      
    # Set specific channel
    - name: Configure WiFi channel
      command: nmcli connection modify "{{ ap_name }}" 802-11-wireless.channel 7
      
    # Configure to AP mode
    - name: Configure WiFi band, mode, channel, IP Settings IP sharing, Passwordless Auth and Disable IPv6 and autoconnect for AP
      command: >
        nmcli connection modify "{{ ap_name }}"
        802-11-wireless.mode ap
        802-11-wireless.band bg
        802-11-wireless.channel 7
        ipv4.addresses "{{ ip_address }}"
        ipv4.method manual
        ipv4.gateway "{{ wifi_ip }}"
        ipv4.dns "{{ wifi_ip }}"
        802-11-wireless-security.key-mgmt none
        ipv6.method disabled
        connection.autoconnect yes


    - name: Ensure correct permissions on nmconnection file
      file:
        path: "/etc/NetworkManager/system-connections/{{ ap_name }}.nmconnection"
        mode: '0600'
        owner: root
        group: root


    
    # Create dnsmasq configuration directory
    #- name: Create dnsmasq directory
    #  file:
    #    path: /etc/NetworkManager/dnsmasq-shared.d
    #    state: directory
    #    mode: '0755'
        
    # Configure DHCP for AP clients
    #- name: Create custom dnsmasq configuration for AP
    #  copy:
    #    dest: /etc/NetworkManager/dnsmasq-shared.d/custom-ap.conf
    #    content: |
    #      interface={{ interface_name }}
    #      dhcp-range=10.10.42.2,10.10.42.252,255.255.255.0,24h
    #    mode: '0644'
    

    # Activate the access point
    - name: Activate the access point
      command: nmcli connection up "{{ ap_name }}"
      register: ap_activation
      failed_when: ap_activation.rc != 0 and "Unknown connection" not in ap_activation.stderr
      ignore_errors: yes
      
    # Enable NetworkManager service to start at boot
    - name: Enable NetworkManager service
      systemd:
        name: NetworkManager
        enabled: yes
        state: started
        
    # Check status of the access point
    - name: Check access point status
      command: nmcli connection show "{{ ap_name }}"
      register: ap_status
      changed_when: false
      
    - name: Display access point status
      debug:
        var: ap_status.stdout_lines