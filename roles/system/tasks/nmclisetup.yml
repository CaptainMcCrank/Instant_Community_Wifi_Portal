---

    
    # Ensure NetworkManager is installed and running
    - name: Check if NetworkManager is already installed
      command: dpkg -l network-manager
      register: nm_installed
      changed_when: false
      failed_when: false

    - name: Install NetworkManager only if not present
      apt:
        name: 
          - network-manager
          - network-manager-gnome
        state: present
        update_cache: yes
      when: nm_installed.rc != 0

    - name: Stop conflicting services only if NetworkManager was just installed
      systemd:
        name: systemd-networkd
        state: stopped
        enabled: false
      ignore_errors: true
      when: nm_installed.rc != 0

    - name: Check NetworkManager service status
      command: systemctl status NetworkManager
      register: nm_status_check
      changed_when: false
      ignore_errors: true

    - name: Display NetworkManager status
      debug:
        var: nm_status_check.stdout_lines

    - name: Enable and start NetworkManager service
      systemd:
        name: NetworkManager
        enabled: true
        state: started

    - name: Wait a moment for NetworkManager to start
      pause:
        seconds: 5

    # Configure wlan0 for DHCP using NetworkManager (safe approach)
    - name: Check if wlan0 interface exists
      shell: "ip link show {{ gateway_interface }} >/dev/null 2>&1"
      register: wlan0_exists
      changed_when: false
      ignore_errors: true

    - name: Copy BeepBoop WiFi connection file to NetworkManager
      copy:
        src: "{{ root_playbook_dir }}/etc/NetworkManager/system-connections/BeepBoop.nmconnection"
        dest: /etc/NetworkManager/system-connections/BeepBoop.nmconnection
        owner: root
        group: root
        mode: '0600'
      when: wlan0_exists.rc == 0
      notify: reload NetworkManager

    - name: Ensure wlan0 is managed by NetworkManager (not dhcpcd)
      shell: "nmcli device set {{ gateway_interface }} managed yes"
      when: wlan0_exists.rc == 0
      ignore_errors: true

    - name: Reload NetworkManager to pick up new connection files
      systemd:
        name: NetworkManager
        state: reloaded
      when: wlan0_exists.rc == 0

    # Try alternative approach - check if NetworkManager is running
    - name: Check if NetworkManager is running
      command: pgrep NetworkManager
      register: nm_pgrep
      changed_when: false
      ignore_errors: true

    - name: Display NetworkManager process check
      debug:
        var: nm_pgrep


    - name: Check if NetworkManager PID file exists
      stat:
        path: /var/run/NetworkManager/NetworkManager.pid
      register: nm_pid_file

    # This doesn't seem to move the needle at all always comes back incomplete.  fatal: [ansibledest.local]: FAILED! => {"changed": false, "elapsed": 60, "msg": "Timeout when waiting for file /var/run/NetworkManager/NetworkManager.pid"}
    # Wait for NetworkManager to be ready with multiple checks
    #- name: Wait for NetworkManager to be ready
    #  wait_for:
    #    path: /var/run/NetworkManager/NetworkManager.pid
    #    timeout: 60
    ## ignore_errors: true

    - name: Display NetworkManager PID file status
      debug:
        var: nm_pid_file

    - name: Wait for NetworkManager to be fully initialized
      command: nmcli general status
      register: nm_status
      until: nm_status.rc == 0
      retries: 15
      delay: 5
      changed_when: false
      ignore_errors: true

    - name: Display final NetworkManager status
      debug:
        var: nm_status

    # Debug interface detection
    - name: Check available network interfaces
      command: nmcli device status
      register: nmcli_devices
      changed_when: false
      
    - name: Display available network interfaces
      debug:
        var: nmcli_devices.stdout_lines

    - name: Check for WiFi interfaces specifically
      command: nmcli device wifi list
      register: nmcli_wifi_devices
      changed_when: false
      ignore_errors: true
      
    - name: Display WiFi interfaces
      debug:
        var: nmcli_wifi_devices.stdout_lines

    # Detect WiFi interface if not specified
    - name: Detect available WiFi interfaces
      shell: "nmcli -t -f DEVICE,TYPE device | grep wifi | cut -d: -f1 | head -1"
      register: available_wifi_interfaces
      changed_when: false
      ignore_errors: true
      
    - name: Display detected WiFi interfaces
      debug:
        var: available_wifi_interfaces.stdout_lines

    - name: Set WiFi interface name with fallback
      set_fact:
        wifi_interface: "{{ interface_name | default('wlan1') }}"
      
    - name: Check if wlan1 exists
      shell: "ip link show wlan1 >/dev/null 2>&1"
      register: wlan1_exists
      changed_when: false
      ignore_errors: true
      
    - name: Use wlan0 if wlan1 doesn't exist yet
      set_fact:
        wifi_interface: "wlan0"
      when: wlan1_exists.rc != 0
      
    - name: Debug interface variables
      debug:
        msg:
          - "Interface name: {{ interface_name }}"
          - "Available WiFi interfaces: {{ available_wifi_interfaces.stdout_lines }}"
          - "Selected WiFi interface: {{ wifi_interface }}"
          - "AP name: {{ ap_name }}"
          - "SSID: {{ ssid }}"

    # Verify the selected interface exists

    #  this seems to fail: 
    # TASK [system : Check if selected WiFi interface exists] **********************************************************************
#task path: /home/pi/Playbooks/Instant_Community_Wifi_Portal/roles/system/tasks/nmclisetup.yml:174
#fatal: [ansibledest.local]: FAILED! => {"changed": false, "cmd": ["nmcli", "device", "status", "|", "grep", "wlan1"], "delta": "0:00:00.103529", "end": "2025-08-17 11:38:03.426143", "msg": "non-zero return code", "rc": 2, "start": "2025-08-17 11:38:03.322614", "stderr": "Error: invalid extra argument '|'.", "stderr_lines": ["Error: invalid extra argument '|'."], "stdout": "", "stdout_lines": []}
# ...ignoring

    - name: Check if selected WiFi interface exists
      command: nmcli device status | grep "{{ wifi_interface }}"
      register: interface_check
      changed_when: false
      ignore_errors: true
      
    - name: Display interface check result
      debug:
        var: interface_check

    # Fallback: if interface doesn't exist, try to find wlan1 first, then any WiFi interface
    - name: Find wlan1 interface specifically
      shell: "nmcli -t -f DEVICE,TYPE device | grep wifi | grep wlan1 | cut -d: -f1 | head -1"
      register: wlan1_check
      changed_when: false
      ignore_errors: true
      when: interface_check.rc != 0

    - name: Find any available WiFi interface as fallback
      shell: "nmcli -t -f DEVICE,TYPE device | grep wifi | head -1 | cut -d: -f1"
      register: fallback_wifi_interface
      changed_when: false
      ignore_errors: true
      when: interface_check.rc != 0 and wlan1_check.rc != 0

    - name: Update WiFi interface if fallback needed
      set_fact:
        wifi_interface: "{{ (wlan1_check.stdout | default('')).strip() or (fallback_wifi_interface.stdout | default('')).strip() or 'wlan1' }}"
      when: interface_check.rc != 0

    - name: Final interface selection debug
      debug:
        msg: "Final selected WiFi interface: {{ wifi_interface }}"

    # CRITICAL SAFETY CHECK: Abort if wlan0 is selected for AP
    - name: SAFETY CHECK - Prevent using wlan0 for AP (would break internet)
      fail:
        msg: |
          CRITICAL ERROR: wifi_interface is set to '{{ wifi_interface }}' but wlan0 should NEVER be used for AP!
          wlan0 is the internet gateway interface and must be preserved.
          Expected: wlan1 (AP interface)
          This would orphan the device by breaking internet connectivity.
      when: wifi_interface == "wlan0"

    # Check if NetworkManager connection exists
    - name: Check if AP connection profile exists
      command: nmcli connection show "{{ ap_name }}"
      register: nmcli_show_result
      failed_when: false
      changed_when: false
    
    # Delete the connection if it exists to ensure clean setup
    - name: Delete existing AP connection if exists
      community.general.nmcli:
        state: absent
        conn_name: "{{ ap_name }}"
      when: nmcli_show_result.rc == 0

    # SAFETY: Only check for AP connections on wlan1, NEVER delete wlan0 connections
    - name: Check for existing AP connections on wlan1 only (SAFE)
      shell: nmcli -t -f NAME,DEVICE connection show | grep ":{{ wifi_interface }}$" || true
      register: existing_ap_connections
      changed_when: false
      ignore_errors: true

    - name: Display existing AP connections on target interface
      debug:
        msg: |
          Only checking AP connections on {{ wifi_interface }}, NOT touching wlan0
          Found connections: {{ existing_ap_connections.stdout_lines | default([]) }}

    - name: Delete only AP connections on target interface (SAFE - excludes wlan0)
      command: nmcli connection delete "{{ item.split(':')[0] }}"
      loop: "{{ existing_ap_connections.stdout_lines }}"
      when: 
        - existing_ap_connections.stdout_lines is defined
        - item is not none
        - item != ""
        - item.split(':')[1] == wifi_interface
        - wifi_interface != "wlan0"  # SAFETY: Never delete wlan0 connections
      ignore_errors: true

    # Create the access point connection (delete first to ensure clean state)
    - name: Delete existing AP connection if exists (clean slate approach)
      command: nmcli connection delete "{{ ap_name }}"
      ignore_errors: true

    - name: Create new open access point connection
      command: >
        nmcli connection add type wifi
        ifname "{{ wifi_interface }}"
        con-name "{{ ap_name }}"
        mode ap
        ssid "{{ ssid }}"
      register: connection_creation
      failed_when: false

    - name: Display connection creation result
      debug:
        var: connection_creation

    # If connection creation failed due to interface issues, try without specifying interface
    - name: Create access point connection without interface specification
      command: >
        nmcli connection add type wifi
        con-name "{{ ap_name }}"
        mode ap
        ssid "{{ ssid }}"
      register: connection_creation_fallback
      failed_when: false
      when: connection_creation.rc != 0

    - name: Display fallback connection creation result
      debug:
        var: connection_creation_fallback
      when: connection_creation.rc != 0

    # Configure the connection for 2.4GHz band and network settings
    - name: Configure AP connection settings
      command: >
        nmcli connection modify "{{ ap_name }}"
        connection.interface-name "{{ wifi_interface }}"
        802-11-wireless.band bg
        802-11-wireless.channel 7
        ipv4.method manual
        ipv4.addresses "{{ ip_address }}"
        ipv4.gateway "{{ wifi_ip }}"
        ipv4.dns "{{ wifi_ip }}"
        ipv6.method disabled
        connection.autoconnect yes

    - name: Ensure correct permissions on nmconnection file
      file:
        path: "/etc/NetworkManager/system-connections/{{ ap_name }}.nmconnection"
        mode: '0600'
        owner: root
        group: root

    # Check and fix the connection file if needed
    - name: Check if connection file exists
      stat:
        path: "/etc/NetworkManager/system-connections/{{ ap_name }}.nmconnection"
      register: connection_file_check

    - name: Display connection file check
      debug:
        var: connection_file_check


    # Verify the connection was created correctly
    - name: Verify AP connection configuration
      command: nmcli connection show "{{ ap_name }}"
      register: ap_connection_verify
      changed_when: false
      ignore_errors: true

    - name: Display AP connection configuration
      debug:
        var: ap_connection_verify.stdout_lines

    # Check if the WiFi interface is already connected to something
    - name: Check current WiFi interface status
      shell: nmcli device status | grep "{{ wifi_interface }}"
      register: wifi_interface_status
      changed_when: false
      ignore_errors: true

    - name: Display WiFi interface status
      debug:
        var: wifi_interface_status.stdout_lines

    # SAFETY: Only disconnect AP interface (wlan1), NEVER disconnect wlan0 
    - name: Disconnect AP interface from existing connections (SAFE - wlan1 only)
      command: nmcli device disconnect "{{ wifi_interface }}"
      register: disconnect_result
      changed_when: false
      ignore_errors: true
      when: 
        - wifi_interface_status.rc == 0
        - wifi_interface != "wlan0"  # SAFETY: Never disconnect wlan0 (internet connection)
        - wifi_interface == "wlan1"   # SAFETY: Only disconnect intended AP interface

    - name: Display disconnect result
      debug:
        var: disconnect_result
      when: wifi_interface_status.rc == 0

    # Activate the access point
    - name: Activate the access point
      command: nmcli connection up "{{ ap_name }}"
      register: ap_activation
      failed_when: false
      ignore_errors: true
      
    - name: Display access point activation result
      debug:
        var: ap_activation
      
    # If activation failed, reload NetworkManager and try again
    - name: Reload NetworkManager if activation failed
      systemd:
        name: NetworkManager
        state: reloaded
      when: ap_activation.rc != 0
      ignore_errors: true

    - name: Wait for NetworkManager to reload
      pause:
        seconds: 5
      when: ap_activation.rc != 0

    - name: Try activating access point again after reload
      command: nmcli connection up "{{ ap_name }}"
      register: ap_activation_retry
      failed_when: false
      ignore_errors: true
      when: ap_activation.rc != 0

    - name: Display retry activation result
      debug:
        var: ap_activation_retry
      when: ap_activation.rc != 0
      
    # Check status of the access point
    - name: Check access point status
      command: nmcli connection show "{{ ap_name }}"
      register: ap_status
      changed_when: false
      
    - name: Display access point status
      debug:
        var: ap_status.stdout_lines

    # Create systemd service for NetworkManager AP management
    - name: Create NetworkManager AP management service
      copy:
        dest: /etc/systemd/system/nm-ap-manager.service
        content: |
          [Unit]
          Description=NetworkManager Access Point Manager
          After=network.target network-online.target
          Wants=network-online.target
          
          [Service]
          Type=oneshot
          RemainAfterExit=yes
          ExecStart=/bin/bash -c 'nmcli connection up "{{ ap_name }}" || true'
          ExecStop=/bin/bash -c 'nmcli connection down "{{ ap_name }}" || true'
          
          [Install]
          WantedBy=multi-user.target
        owner: root
        group: root
        mode: '0644'

    - name: Enable NetworkManager AP management service
      systemd:
        name: nm-ap-manager
        enabled: true

    # Copy verification script
    - name: Copy WiFi AP verification script
      copy:
        src: "{{ root_playbook_dir }}/usr/local/bin/verify-wifi-ap.sh"
        dest: /usr/local/bin/verify-wifi-ap.sh
        mode: '0755'
        owner: root
        group: root

    - name: Run WiFi AP verification
      command: /usr/local/bin/verify-wifi-ap.sh
      register: wifi_verification
      changed_when: false
      
    - name: Display WiFi AP verification results
      debug:
        var: wifi_verification.stdout_lines