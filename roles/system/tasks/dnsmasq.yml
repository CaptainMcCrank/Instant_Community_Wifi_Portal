---
   - name: Install dnsmasq
     apt:
       name: dnsmasq
       state: present
       update_cache: true

   - name: Copy /etc/dnsmasq.conf configuration that is used for DHCP assignment
     copy:
       src: "{{ root_playbook_dir }}/etc/IIABdnsmasq.conf"
       dest: /etc/dnsmasq.conf
       owner: root
       group: root
       mode: 0744
     tags: os_config_files

   - name: Create dnsmasq systemd override directory
     file:
       path: /etc/systemd/system/dnsmasq.service.d
       state: directory
       mode: '0755'
       owner: root
       group: root

   - name: Create dnsmasq systemd override file
     copy:
       dest: /etc/systemd/system/dnsmasq.service.d/override.conf
       content: |
         [Unit]
         After=network.target network-online.target
         Wants=network-online.target
         
         [Service]
         ExecStartPre=/bin/sleep 5
       owner: root
       group: root
       mode: '0644'

   - name: enable dnsmasq
     command: systemctl enable dnsmasq
     tags: 
     - Hotspot

   - name: start dnsmasq
     command: systemctl start dnsmasq
     tags: 
     - Hotspot

     