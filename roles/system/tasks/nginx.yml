---
     
    - name: Install Nginx package
      apt:
        name: nginx
        state: present

    - name: Copy nginx configuration files over to target
      synchronize:
        src: "{{ root_playbook_dir }}/etc/nginx/"
        dest: /etc/nginx
        recursive: yes

    - name: Update nginx thepub.local config to use hostname variable
      replace:
        path: /etc/nginx/sites-available/thepub.local
        regexp: '/var/www/thepub\.local'
        replace: '/var/www/{{ hostname }}'
      tags: hostname_fix

    - name: Update nginx server_name to use hostname variable  
      replace:
        path: /etc/nginx/sites-available/thepub.local
        regexp: 'server_name thepub\.local www\.thepub\.local'
        replace: 'server_name {{ hostname }} www.{{ hostname }}'
      tags: hostname_fix

    - name: Remove default nginx site to prevent conflicts
      file:
        path: /etc/nginx/sites-enabled/default
        state: absent
      notify: reload nginx

    - name: Remove conflicting selfie-portal nginx site (causes 502 errors)
      file:
        path: /etc/nginx/sites-enabled/selfie-portal
        state: absent
      notify: reload nginx

    - name: Enable thepub.local nginx site
      file:
        src: /etc/nginx/sites-available/thepub.local
        dest: /etc/nginx/sites-enabled/thepub.local
        state: link
      notify: reload nginx

    - name: Enable selfies.griffincreektrestle.net nginx site (for Cloudflare certificate HTTPS access)
      file:
        src: /etc/nginx/sites-available/selfies.griffincreektrestle.net
        dest: /etc/nginx/sites-enabled/selfies.griffincreektrestle.net
        state: link
      notify: reload nginx

    - name: Check for nginx configuration conflicts
      shell: nginx -t 2>&1 | grep -i "conflicting server name" || echo "No conflicts found"
      register: nginx_conflicts_check
      changed_when: false
      
    - name: Display nginx conflict check results
      debug:
        var: nginx_conflicts_check.stdout_lines
        
    - name: Fail if nginx has conflicting server names
      fail:
        msg: "NGINX CONFIGURATION CONFLICT DETECTED! Multiple sites trying to serve the same hostname. Check sites-enabled directory."
      when: "'conflicting server name' in nginx_conflicts_check.stdout"

    - name: Test nginx configuration
      command: nginx -t
      register: nginx_test
      changed_when: false
      failed_when: nginx_test.rc != 0

    - name: Start and enable nginx service
      systemd:
        name: nginx
        state: started
        enabled: yes
     
