---
- name: Install Python dependencies for selfie portal
  apt:
    name:
      - python3
      - python3-pip
      - python3-venv
      - python3-dev
      - libjpeg-dev
      - zlib1g-dev
    state: present
  tags:
    - selfie_portal
    - streamer

- name: Create selfie portal directory structure
  file:
    path: "{{ item }}"
    state: directory
    owner: www-data
    group: www-data
    mode: '0755'
  loop:
    - /var/www/ansibledest.local/apps/selfies
    - /var/www/ansibledest.local/apps/selfies/data
    - /var/www/ansibledest.local/apps/selfies/data/uploads
    - /var/www/ansibledest.local/apps/selfies/static
    - /var/www/ansibledest.local/apps/selfies/templates
  tags:
    - selfie_portal
    - streamer

- name: Copy selfie portal Flask application
  copy:
    src: "{{ root_playbook_dir }}/var/www/ansibledest.local/apps/selfies/app.py"
    dest: /var/www/ansibledest.local/apps/selfies/app.py
    owner: www-data
    group: www-data
    mode: '0755'
  tags:
    - selfie_portal
    - streamer

- name: Copy selfie portal requirements
  copy:
    src: "{{ root_playbook_dir }}/var/www/ansibledest.local/apps/selfies/requirements.txt"
    dest: /var/www/ansibledest.local/apps/selfies/requirements.txt
    owner: www-data
    group: www-data
    mode: '0644'
  tags:
    - selfie_portal
    - streamer

- name: Copy selfie portal templates
  synchronize:
    src: "{{ root_playbook_dir }}/var/www/ansibledest.local/apps/selfies/templates/"
    dest: /var/www/ansibledest.local/apps/selfies/templates/
    owner: www-data
    group: www-data
  tags:
    - selfie_portal
    - streamer

- name: Copy selfie portal static files
  synchronize:
    src: "{{ root_playbook_dir }}/var/www/ansibledest.local/apps/selfies/static/"
    dest: /var/www/ansibledest.local/apps/selfies/static/
    owner: www-data
    group: www-data
  tags:
    - selfie_portal
    - streamer

- name: Create Python virtual environment for selfie portal
  command: python3 -m venv /var/www/ansibledest.local/apps/selfies/venv
  args:
    creates: /var/www/ansibledest.local/apps/selfies/venv/bin/activate
  tags:
    - selfie_portal
    - streamer

- name: Install Python packages in virtual environment
  pip:
    requirements: /var/www/ansibledest.local/apps/selfies/requirements.txt
    virtualenv: /var/www/ansibledest.local/apps/selfies/venv
    virtualenv_command: python3 -m venv
  tags:
    - selfie_portal
    - streamer

- name: Create systemd service file for selfie portal
  copy:
    dest: /etc/systemd/system/selfie-portal.service
    content: |
      [Unit]
      Description=Selfie Portal Flask Application
      After=network.target
      Wants=network.target

      [Service]
      Type=simple
      User=www-data
      Group=www-data
      WorkingDirectory=/var/www/ansibledest.local/apps/selfies
      Environment=PATH=/var/www/ansibledest.local/apps/selfies/venv/bin
      ExecStart=/var/www/ansibledest.local/apps/selfies/venv/bin/python app.py
      Restart=always
      RestartSec=10

      [Install]
      WantedBy=multi-user.target
    owner: root
    group: root
    mode: '0644'
  tags:
    - selfie_portal
    - streamer

- name: Enable and start selfie portal service
  systemd:
    name: selfie-portal
    state: started
    enabled: yes
    daemon_reload: yes
  tags:
    - selfie_portal
    - streamer

- name: Configure nginx for selfie portal
  copy:
    dest: /etc/nginx/sites-available/selfie-portal
    content: |
      server {
          listen 80;
          server_name {{ hostname }};
          
          # Selfie portal location
          location /selfies {
              proxy_pass http://127.0.0.1:5001;
              proxy_set_header Host $host;
              proxy_set_header X-Real-IP $remote_addr;
              proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
              proxy_set_header X-Forwarded-Proto $scheme;
              
              # Handle large file uploads
              client_max_body_size 10M;
              proxy_read_timeout 300s;
              proxy_connect_timeout 75s;
          }
          
          # Serve uploaded images directly
          location /selfies/data/uploads/ {
              alias /var/www/ansibledest.local/apps/selfies/data/uploads/;
              expires 1d;
              add_header Cache-Control "public, immutable";
          }
          
          # Main community site (existing configuration)
          location / {
              proxy_pass http://127.0.0.1:8080;
              proxy_set_header Host $host;
              proxy_set_header X-Real-IP $remote_addr;
              proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
              proxy_set_header X-Forwarded-Proto $scheme;
          }
      }
    owner: root
    group: root
    mode: '0644'
  tags:
    - selfie_portal
    - streamer

- name: Enable selfie portal nginx site
  file:
    src: /etc/nginx/sites-available/selfie-portal
    dest: /etc/nginx/sites-enabled/selfie-portal
    state: link
  tags:
    - selfie_portal
    - streamer

- name: Test nginx configuration
  command: nginx -t
  tags:
    - selfie_portal
    - streamer

- name: Reload nginx
  systemd:
    name: nginx
    state: reloaded
  tags:
    - selfie_portal
    - streamer

- name: Add selfie portal link to main community site
  lineinfile:
    path: /var/www/ansibledest.local/sites/{{ hostname }}/index.html
    line: '<li><a href="/selfies" class="btn btn-primary"><i class="fas fa-camera"></i> Selfie Portal</a></li>'
    insertafter: '<ul class="nav-links">'
    state: present
  tags:
    - selfie_portal
    - streamer
  ignore_errors: true

- name: Set proper permissions for selfie portal data directory
  file:
    path: /var/www/ansibledest.local/apps/selfies/data
    owner: www-data
    group: www-data
    mode: '0755'
    recurse: yes
  tags:
    - selfie_portal
    - streamer

- name: Create initial index.json file
  copy:
    dest: /var/www/ansibledest.local/apps/selfies/data/index.json
    content: "[]"
    owner: www-data
    group: www-data
    mode: '0644'
  tags:
    - selfie_portal
    - streamer 